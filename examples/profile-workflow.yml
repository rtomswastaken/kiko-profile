# Copy into your profile repository as .github/workflows/kiko.yml,
# then embed <img src="kiko/kiko.gif" width="100%" alt="Kiko the Snapping Turtle"> in your README.md.

name: Kiko Profile Companion

on:
  schedule:
    # Runs shortly after midnight UTC
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/kiko.yml

permissions:
  contents: write

concurrency:
  group: kiko-profile
  cancel-in-progress: false

jobs:
  kiko:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Kiko Snapping Turtle
        uses: rtomswastaken/kiko-profile@v1
        with:
          stage: auto
          background: transparent
          output-dir: assets/kiko

      - name: Commit and push changes
        shell: bash
        run: |
          git add assets/kiko/kiko.gif assets/kiko/kiko.png
          if git diff --cached --quiet; then
            echo "Kiko is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update walking kiko companion [skip ci]"
          git push origin HEAD
